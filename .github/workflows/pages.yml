name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm test
      - name: Prepare public files
        run: |
          mkdir -p _site/docs
          cp index.html style.css app.js engine.js formats.js coaching.js discovery.js thinking.js studio.js synthesis.js synthesis-ui.js disruption.js provocations.js speech.js exports.js volcano.js document-import.js spurwechsel.js studio.css favicon.svg _site/
          cp -R vendor _site/vendor
          cp docs/materialgrundlage.md _site/docs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
